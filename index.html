<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>健</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 全畫面 Universe 背景（Finisher Header 用） -->
  <div id="fx-root" class="finisher-header"></div>

  <!-- 頂部分頁 -->
  <div class="top-tabs sticky-tabs">
    <button class="tab-btn active" data-tab="main">主頁</button>
    <button class="tab-btn" data-tab="calendar">日曆</button>
    <button class="tab-btn" data-tab="records">紀錄</button>
  </div>

  <!-- 主頁 -->
  <div id="page-main" class="page show">
    <div class="app" id="appRoot"></div>

    <!-- 上：動作列（依目前部位） -->
    <div class="action-nav-wrap">
      <div class="action-nav" id="actionNav" aria-label="選擇動作"></div>
    </div>

    <!-- 下：部位列 -->
    <nav class="bottom-nav" id="bottomNav" aria-label="選擇部位"></nav>

    <!-- 右下：完成運動 + 清除全部 -->
    <button id="finishDay" class="btn btn-primary finish-btn" aria-label="完成運動並匯出">完成運動</button>
    <button id="clearAll"  class="btn btn-danger  clear-btn"  aria-label="清除全部紀錄">清除全部</button>
  </div>

  <!-- 日曆頁 -->
  <section id="page-calendar" class="page">
    <div class="cal-layout">
      <div class="cal-left">
        <div class="cal-header">
          <button id="prevMonth" class="cal-nav" aria-label="Previous month">‹</button>
          <div id="monthLabel" class="cal-month"></div>
          <button id="nextMonth" class="cal-nav" aria-label="Next month">›</button>
        </div>
        <div id="calendarWeekdays" class="calendar-weekdays"></div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </div>

      <!-- 右側詳情欄 -->
      <aside class="cal-side">
        <div class="side-title" id="calSideTitle">選擇日期查看詳情</div>
        <ul class="side-list" id="calSideList"></ul>
      </aside>
    </div>
  </section>

  <!-- 紀錄頁 -->
  <section id="page-records" class="page">
    <div class="records-filters">
      <div class="rf-row">
        <div class="rf-label">部位</div>
        <div id="recordsPartChips" class="chip-row"></div>
      </div>
      <div class="rf-row">
        <div class="rf-label">動作</div>
        <div id="recordsActionChips" class="chip-row"></div>
      </div>
    </div>

    <div class="table-wrap">
      <table class="records-table">
        <thead>
          <tr>
            <th>日期</th><th>部位</th><th>動作</th>
            <th>組1</th><th>組2</th><th>組3</th><th>組4</th>
            <th>重1</th><th>重2</th><th>重3</th><th>重4</th>
          </tr>
        </thead>
        <tbody id="recordsTbody"></tbody>
      </table>
    </div>
  </section>

  <!-- 完成運動面板（直接寫入 Excel） -->
  <div id="exportPanel" class="export-panel hidden" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
    <div class="export-card">
      <div class="export-head">
        <h3 id="exportTitle">今日紀錄（將寫入既有 CSV）</h3>
        <button id="closeExportBtn" class="btn btn-danger btn-sm">關閉</button>
      </div>
      <div class="export-body">
        <div class="export-table-wrap">
          <table class="export-table">
            <thead>
              <tr>
                <th>日期</th><th>部位</th><th>動作</th>
                <th>組1</th><th>組2</th><th>組3</th><th>組4</th>
                <th>重1</th><th>重2</th><th>重3</th><th>重4</th>
              </tr>
            </thead>
            <tbody id="exportTableBody"></tbody>
          </table>
        </div>
      </div>
      <div class="export-actions">
        <button id="confirmAppendBtn" class="btn btn-primary">完成</button>
      </div>
    </div>
  </div>

  <noscript>此原型需要 JavaScript 才能運作。</noscript>

  <!-- Finisher Universe 背景 -->
  <script src="https://finisher.co/lab/header/assets/finisher-header.es5.min.js" type="text/javascript"></script>
  <script type="text/javascript">
  new FinisherHeader({
    "count": 10,
    "size": {
      "min": 1300,
      "max": 1500,
      "pulse": 0
    },
    "speed": {
      "x": {
        "min": 0.1,
        "max": 0.6
      },
      "y": {
        "min": 0.1,
        "max": 0.6
      }
    },
    "colors": {
      "background": "#9138e5",
      "particles": [
        "#ff4848",
        "#000000",
        "#2235e5",
        "#000000",
        "#ff0000"
      ]
    },
    "blending": "overlay",
    "opacity": {
      "center": 0.5,
      "edge": 0.05
    },
    "skew": 0,
    "shapes": [
      "c"
    ]
  });
  </script>

  <script src="app.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
