<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>健身紀錄</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="top-tabs sticky-tabs">
    <button class="tab-btn active" data-tab="main">主頁</button>
    <button class="tab-btn" data-tab="calendar">日曆</button>
    <button class="tab-btn" data-tab="records">紀錄</button>
    <button class="tab-btn" data-tab="settings">設定</button>
  </div>

  <div id="page-main" class="page show">
    <div class="app" id="appRoot"></div>

    <div class="action-nav-wrap">
      <div class="action-nav" id="actionNav" aria-label="選擇動作"></div>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="選擇部位"></nav>

    <div class="float-btn-wrap">
      <button id="finishDay" class="btn btn-primary finish-btn">完成運動</button>
      <button id="clearAll"  class="btn btn-danger  clear-btn">清除全部</button>
    </div>
  </div>

  <section id="page-calendar" class="page">
    <div class="cal-layout">
      <div class="cal-left">
        <div class="cal-header">
          <button id="prevMonth" class="cal-nav">‹</button>
          <div id="monthLabel" class="cal-month"></div>
          <button id="nextMonth" class="cal-nav">›</button>
        </div>
        <div id="calendarWeekdays" class="calendar-weekdays"></div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </div>
      <aside class="cal-side">
        <div class="side-title" id="calSideTitle">選擇日期查看詳情</div>
        <ul class="side-list" id="calSideList"></ul>
      </aside>
    </div>
  </section>

  <section id="page-records" class="page">
    <div class="records-filters">
      <div class="rf-row">
        <div class="rf-label">部位</div>
        <div id="recordsPartChips" class="chip-row"></div>
      </div>
      <div class="rf-row">
        <div class="rf-label">動作</div>
        <div id="recordsActionChips" class="chip-row" style="min-height: 40px; align-items: center;"></div>
      </div>
    </div>

    <div class="chart-container" style="display: none;">
      <canvas id="progressChart"></canvas>
    </div>

    <div class="table-wrap">
      <table class="records-table">
        <thead>
          <tr>
            <th>日期</th><th>部位</th><th>動作</th>
            <th>第1組</th><th>第2組</th><th>第3組</th><th>第4組</th>
          </tr>
        </thead>
        <tbody id="recordsTbody"></tbody>
      </table>
    </div>

    <div class="float-btn-wrap" style="bottom: 30px; top: auto; right: 20px;">
       <button id="toggleUnitFloatBtn" class="btn btn-primary finish-btn" style="width:auto; min-width:120px;">單位: LB</button>
    </div>
  </section>

  <section id="page-settings" class="page">
    <div class="block settings-block">
      <div class="summary">
        <span class="hname">編輯動作庫</span>
      </div>
      <div class="text" style="margin-bottom: 25px;">在此新增或刪除部位與動作，變更後請記得按儲存。</div>
      <div id="editor-container" class="editor-wrap"></div>
      <div class="actions" style="margin-top: 20px; justify-content: flex-end;">
        <button id="saveCatalogBtn" class="btn btn-primary">儲存變更到雲端</button>
      </div>
    </div>
  </section>

  <div id="exportPanel" class="export-panel hidden" role="dialog">
    <div class="export-card">
      <div class="export-head">
        <h3 id="exportTitle">本次運動總結</h3>
        <p>確認無誤後將同步至雲端資料庫</p>
      </div>
      <div id="exportTableBody"></div> 
      <div class="export-actions">
        <button id="closeExportBtn" class="btn btn-danger">返回修改</button>
        <button id="confirmAppendBtn" class="btn btn-primary">確認提交</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="customModal" class="custom-modal hidden">
    <div class="modal-content">
      <h3 id="modalTitle">提示</h3>
      <p id="modalBody">內容</p>
      <div class="modal-actions">
        <button id="modalBtnCancel" class="btn">取消</button>
        <button id="modalBtnConfirm" class="btn btn-primary" style="background: var(--accent-danger);">確定</button>
      </div>
    </div>
  </div>

  <noscript>此原型需要 JavaScript 才能運作。</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
